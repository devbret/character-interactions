<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Interaction Graphs - Bret Bernhoft</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <link rel="stylesheet" href="main.css" />
    <meta name="author" content="Bret Bernhoft" />
    <link
      rel="icon"
      href="https://hosting.photobucket.com/bbcfb0d4-be20-44a0-94dc-65bff8947cf2/ff4a3384-baa9-4bc2-94c9-6bff4e3d3ea0.png"
      type="image/x-icon"
    />
    <meta
      name="description"
      content="Interactive D3.js interface for exploring character relationship networks with search, filtering, k-hop exploration and ego-network visualization."
    />
  </head>
  <body>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-4EQYBW87F5"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-4EQYBW87F5");
    </script>

    <div class="ui-bar">
      <input id="searchInput" type="text" placeholder="Search names…" />

      <label title="Only show matches (hides others)">
        <input id="filterToggle" type="checkbox" />
        Filter
      </label>

      <label for="nodeLimitInput" title="Maximum number of visible nodes">
        Nodes
      </label>
      <input
        id="nodeLimitInput"
        type="number"
        min="1"
        step="1"
        value="15"
        style="width: 5.5em"
      />
      <button id="applyNodeLimitBtn" type="button">Apply</button>

      <label title="Toggle dark mode">
        <input id="darkModeToggle" type="checkbox" />
        Dark
      </label>

      <button id="clearBtn" type="button">Clear</button>
      <button id="fitBtn" type="button">Fit</button>
    </div>

    <div id="khopMenu" role="dialog" aria-modal="false">
      <div class="title" id="khopTitle">k-hop neighborhood</div>
      <div class="row">
        <label for="kHop">k =</label>
        <input
          id="kHop"
          type="number"
          min="0"
          max="6"
          value="0"
          style="width: 4.5em"
        />
      </div>
      <div class="row">
        <button id="applyKHop" type="button">Apply</button>
        <button id="clearKHop" type="button">Clear</button>
        <button id="egoViewBtn" type="button">Radial</button>
        <button id="closeKHop" type="button" style="margin-left: auto">
          Close
        </button>
      </div>
    </div>

    <div id="egoOverlay">
      <div id="egoCard">
        <div id="egoHeader">
          <div id="egoTitle">Ego Network</div>
          <div id="egoActions">
            <button id="egoDownloadBtn">Download SVG</button>
            <button id="egoCloseBtn">Close</button>
          </div>
        </div>
        <div id="egoCanvas"></div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
